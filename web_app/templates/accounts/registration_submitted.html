{% extends "base.html" %}
{% block title %}Registration submitted · TweakTech{% endblock %}
{% block guest_content %}
<section class="card-tw p-4 p-sm-5 text-center">
  <div class="stat-icon mx-auto mb-3"><i class="bi bi-person-check"></i></div>
  <h1 class="h4 fw-bold">Registration submitted</h1>
  <p class="text-muted">Your details are waiting for Admin review. You can sign in after an Admin approves your account and assigns your role.</p>
  <a class="btn btn-primary btn-tw" href="{% url 'accounts:login' %}">Return to sign in</a>
</section>
{% endblock %}
