<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Check your connection · TweakTech</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: #fff;
      color: #1A1A1C;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .offline-content { width: min(100%, 520px); }
    .offline-art { display: block; width: min(100%, 420px); height: auto; margin: 0 auto 22px; }
    .offline-heading { margin: 0; font-size: clamp(1.65rem, 5vw, 1.9rem); font-weight: 700; letter-spacing: -.035em; }
    .offline-subtitle { margin: 10px 0 24px; color: #606168; font-size: 1rem; line-height: 1.6; }
    .offline-button {
      display: inline-flex;
      min-width: 150px;
      height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: #1A1A1C;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .offline-button:hover { background: #34353A; }
    .offline-button:focus-visible { outline: 3px solid #6A2CFF; outline-offset: 4px; }
    .cat-tail { transform-box: view-box; transform-origin: 382px 137px; }
    .cat-paw { transform-box: fill-box; transform-origin: 55% 12%; }
    .cat-eye { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .cat-tail { animation: tail-sway 3s ease-in-out infinite alternate; }
      .cat-eye { animation: eye-blink 5s ease-in-out infinite; }
      .cat-paw { animation: paw-tap 2.8s ease-in-out infinite; }
    }
    @keyframes tail-sway {
      from { transform: rotate(-4deg); }
      to { transform: rotate(5deg); }
    }
    @keyframes eye-blink {
      0%, 45%, 49%, 100% { transform: scaleY(1); }
      47% { transform: scaleY(.08); }
    }
    @keyframes paw-tap {
      0%, 72%, 100% { transform: translateY(0); }
      82% { transform: translateY(8px); }
      91% { transform: translateY(0); }
    }
    @media (max-width: 480px) {
      body { padding: 20px; }
      .offline-art { margin-bottom: 14px; }
    }
  </style>
</head>
<body>
  <main class="offline-content">
    <svg class="offline-art" viewBox="0 0 560 260" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="162" width="500" height="64" rx="32" fill="#EFEFEF"/>
      <g class="cat-tail" fill="none" stroke="#332F36" stroke-linecap="round" stroke-linejoin="round" stroke-width="24">
        <path d="M382 145c57 2 85 31 101 71 12 30 32 37 49 22 9-8 7-20-3-23-8-2-13 5-9 11"/>
      </g>
      <path d="M115 173c-8-39 12-69 48-78 39-10 73 9 89 34 24-14 54-21 90-18 55 5 80 26 81 55 1 24-16 39-47 39H164c-26 0-43-11-49-32z" fill="#332F36"/>
      <path d="m111 116 7-49 36 35M159 101l31-39 17 52" fill="#332F36" stroke="#332F36" stroke-linejoin="round" stroke-width="12"/>
      <ellipse class="cat-eye" cx="145" cy="120" rx="5" ry="8" fill="#FFFFFF"/>
      <ellipse class="cat-eye" cx="178" cy="120" rx="5" ry="8" fill="#FFFFFF"/>
      <path class="cat-paw" d="M217 150c17-4 28 6 27 22l-2 38c-1 13-10 21-22 18-10-2-14-11-12-23l4-28-18 3c-10 1-17-4-18-13-1-9 6-15 15-16z" fill="#332F36"/>
      <path d="M324 183c20 8 48 8 67 0" fill="none" stroke="#332F36" stroke-linecap="round" stroke-width="4"/>
    </svg>
    <h1 class="offline-heading">Check your connection</h1>
    <p class="offline-subtitle">You're offline. We'll reconnect automatically.</p>
    <button class="offline-button" type="button" onclick="window.location.reload()">Try again</button>
  </main>
  <script>
    window.addEventListener("online", () => window.location.reload());
  </script>
</body>
</html>
